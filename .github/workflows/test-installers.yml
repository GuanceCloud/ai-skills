name: Test skill installers

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test deterministic release and installers
        run: python tests/test_installers.py
      - name: Test RUM host boundaries
        run: python -B -m unittest discover -s rum-instrument/tests -p test_host_support.py -q
      - name: Test RUM onboarding and portable Skill package
        if: runner.os != 'Windows'
        run: |
          python -B -m unittest discover -s rum-instrument/tests -q
          python -B -m unittest discover -s tests -p 'test_*rum*' -q
          python -B -m unittest discover -s tests -p test_skill_registry.py -q
